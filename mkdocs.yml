site_name: CIMTool
repo_url: https://github.com/CIMug-org/CIMTool
copyright: Hosted on GitHub Pages · <a href="https://github.com/cimug-org">github.com/cimug-org</a>
theme:
  name: material
  custom_dir: overrides
  logo: logos/cimtool-logo.svg
  favicon: logos/cimtool-v2.ico
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - footnotes
  - admonition
  - tables
  - pymdownx.details
  - toc:
      toc_depth: 3
nav:
  - 'index.md'
  - 'core-concepts.md'
  - 'getting-started.md'
  - 'How To':
    - 'how-to/obtain-cim-models.md'
    - 'how-to/create-a-project.md'
    - 'how-to/navigate-workspace.md'
    - 'how-to/import-cim-uml.md'
    - 'how-to/create-a-profile.md'
    - 'how-to/edit-a-profile.md'
    - 'how-to/browsing-the-CIM-UML.md'
    - 'how-to/exchange-a-project.md'
    - 'how-to/search-schemas-profiles.md'
    - 'how-to/generate-database-schema.md'
    - 'how-to/profile-real-time-preview.md'
    - 'how-to/using-cimtool-documentation-features.md'
    - 'how-to/profile-maintenance.md'
    - 'how-to/comparing-profiles-schemas.md'
    - 'how-to/associations-anonymous-classes.md'
    - 'how-to/namespaces-in-cimtool.md'
    - 'how-to/cimtool-support-for-extension-namespaces.md'
    - 'how-to/modeling-cim-extensions.md'
  - 'Further Learning':
    - 'further-learning/uml-xmi-owl.md'
    - 'further-learning/cim.md'
    - 'further-learning/protege-and-topbraid.md'
  - 'SchemaOps Automation & Integration':
    - 'schemaops/cimtool-cli.md'
  - 'release-notes.md'
  - 'download-latest.md'